name: Update Midterm Stock Gems (중단기 5대 알고리즘 종목 발굴 자동 업데이트)

on:
  schedule:
    # 평일(월~금) 한국시간 18:30 (독일 겨울시간 10:30 / UTC 09:30) - 장 마감 및 외인·기관 수급 확정 직후 자동 실행
    - cron: '30 9 * * 1-5'
  # GitHub Actions 탭에서 언제든 수동 실행 가능
  workflow_dispatch:
    inputs:
      target_date:
        description: '분석 기준일 (YYYYMMDD, 비워두면 최신 영업일 자동 감지)'
        required: false
        default: ''
      min_val_eok:
        description: '최소 거래대금 기준 (억원)'
        required: false
        default: '10'

permissions:
  contents: write

jobs:
  update-midterm-gems:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache KRX 60-day backdata
        uses: actions/cache@v4
        with:
          path: scripts/krx_cache
          key: krx-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            krx-cache-${{ runner.os }}-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run 5-Algorithm Midterm Gems Scanner
        env:
          TZ: Asia/Seoul
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            python scripts/find_midterm_gems.py "${{ github.event.inputs.target_date }}" "${{ github.event.inputs.min_val_eok || '10' }}"
          else
            python scripts/find_midterm_gems.py
          fi

      - name: Commit and push updated JSON to repository
        env:
          TZ: Asia/Seoul
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/midterm_gems_latest.json
          git diff --staged --quiet || (git commit -m "🤖 Auto-update midterm stock gems ($(date +'%Y-%m-%d %H:%M KST'))" && git push)
